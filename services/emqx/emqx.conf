
node {
  name = "emqx@127.0.0.1"
  cookie = "emqxsecretcookie"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

############################
## Dashboard（管理后台）
############################

dashboard {
  listeners {
    http {
      bind = 18083
    }
  }
}

############################
## MQTT Listener
############################

listeners {

  ## MQTT TCP（可选，不对公网开放也行）
  tcp {
    default {
      bind = 1883
    }
  }

  ## MQTT over TLS（生产主力）
  ssl {
    default {
      bind = 8883

      ssl_options {
        certfile = "/opt/emqx/etc/cert/localhost.crt"
        keyfile  = "/opt/emqx/etc/cert/localhost.key"

        verify = verify_none
        fail_if_no_peer_cert = false

        versions = [ "tlsv1.2", "tlsv1.3" ]
      }
    }
  }

  ## MQTT over WebSocket（可选）
  ws {
    default {
      bind = 8083
    }
  }

  ## MQTT over WSS（可选）
  wss {
    default {
      bind = 8084

      ssl_options {
        certfile = "/opt/emqx/etc/cert/localhost.crt"
        keyfile  = "/opt/emqx/etc/cert/localhost.key"
      }
    }
  }
}

############################
## MQTT 协议相关
############################

mqtt {
  max_packet_size = 1MB
  max_clientid_len = 128
  idle_timeout = 15s
}

############################
## 认证（Authentication）
############################

## 禁止匿名访问（关键）
allow_anonymous = false

authentication = [
  {
    mechanism = password_based
    backend = built_in_database
  }
]

############################
## 授权（Authorization）
############################

authorization {
  ## 没匹配到规则，直接拒绝
  no_match = deny
}

############################
## 内置数据库（用户/ACL）
############################

## 默认使用内置 Mnesia
database {
  mnesia {
    dir = "data/mnesia"
  }
}

############################
## 日志（排错很重要）
############################

log {
  file {
    enable = true
    path = "log/emqx.log"
    level = info
  }
}